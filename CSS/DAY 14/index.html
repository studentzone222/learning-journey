<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="style.css" type="text/css" media="all" />
</head>

<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="post-img">

        <div class="post-content">
            <h2 class="post-title">Learn Web Development</h2>
            <p class="post-excerpt">Stay ahead of the curve with the latest trends in web development. Discover what's new and exciting in Everytime</p>
            <button type="submit"><a href="#" class="read-more">Read More</a></button>
        </div>
    </div>
</body>

</html>
