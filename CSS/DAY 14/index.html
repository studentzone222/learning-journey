<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="blog-post-card">
    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="A beautiful mountain landscape"
    >

    <div class="post-content">
      <h2 class="post-title">The Beauty of Nature</h2>

      <p class="post-excerpt">
        Nature offers peace, inspiration, and endless beauty. Discover why spending time outdoors can improve your health and happiness.
      </p>

      <a class="read-more" href="#">Read More</a>
    </div>
  </div>

</body>
</html>
